name: draya_mobile
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # for adapting screen and font size.
  flutter_screenutil: ^5.9.3
  # An SVG rendering
  flutter_svg: ^2.2.3
  # State management
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1
  freezed_annotation: ^3.1.0
  # for dependency injection
  get_it: ^9.1.1
  json_annotation: ^4.9.0
  # Networking
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.9.1
  # localization
  intl: ^0.20.2
  timeago: ^3.7.1
  google_fonts: ^6.3.3
  # reading and writing simple key-value pairs
  shared_preferences: ^2.5.3
  # provides API to store data in secure storage.
  flutter_secure_storage: ^9.2.4
  # Flutter plugin for selecting images from the Android and iOS image library
  image_picker: ^1.2.1
  # Flutter's core Dropdown Button widget with steady dropdown menu
  dropdown_button2: ^2.3.9
  font_awesome_flutter: ^11.0.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  # Flutter library to load and cache network images.
  cached_network_image: ^3.4.1
  # to launch urls
  url_launcher: ^6.3.2
  # Firebase dependencies
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  firebase_crashlytics: ^5.1.0
  # local notification
  flutter_local_notifications: ^21.0.0
  go_router: ^17.3.0
  webview_flutter: ^4.14.1
  file_picker: ^11.0.3

dev_dependencies:
  # for updating your Flutter app's launcher icon.
  flutter_launcher_icons: ^0.14.4
  #Customize Flutter's default white native splash screen
  flutter_native_splash: ^2.4.7
  #A build system for Dart code generation and modular compilation
  build_runner: ^2.10.4
  # Code generator (mainly used with cubit & retrofit)
  freezed: ^3.2.3
  # Automatically generate code for converting to and from JSON by annotating Dart classes
  json_serializable: ^6.9.4
  retrofit_generator: ^10.2.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    # - assets/images/
    - assets/svgs/
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
